# Nginx site for Issue Tracker (see DEPLOY.md). Plain HTTP to start with:
# `certbot --nginx -d monitoring-issue.barokahperkasagroup.tech` then adds the
# HTTPS server block and the HTTP -> HTTPS redirect to this file.
#
# The app is a static Vite build served straight from dist/, no Node process.
# If the repo is cloned somewhere other than /opt/issue-tracker-bpg, change
# `root` below.

server {
    listen 80;
    listen [::]:80;
    server_name monitoring-issue.barokahperkasagroup.tech;

    root /opt/issue-tracker-bpg/dist;
    index index.html;

    # Nginx only compresses text/html by default; the JS and CSS bundles are
    # the bulk of the download. Older Nginx labels .js as application/javascript,
    # newer as text/javascript, so list both.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Build output in assets/ has a content hash in its filename, so it can be
    # cached for good. A new build gets new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router uses real paths (/dashboard, /issue/12), so any path that
    # isn't a file falls back to index.html. index.html itself must not be
    # cached, otherwise browsers keep loading the previous build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
